name: MTPREE-2.20 - netfour

trigger: none

pool:
  name: MTPre

parameters:
- name: action
  displayName: 'Select action (deploy or rollback)'
  type: string
  default: 'deploy'
  values:
  - deploy
  - rollback

variables:
- name: appPoolName
  value: 'netfour'
- name: zipBaseName
  value: 'netfour_Publish'
- name: sourcePath
  value: 'E:\Temp\netfour'
- name: publishPath
  value: 'E:\Deployment\netfour'
- name: deployPath
  value: 'E:\DeployedProjects\netfour'
- name: backupRootPath
  value: 'E:\Deployment\Backup\netfour'
- name: buildConfiguration
  value: 'Release'
- name: action
  value: ${{ parameters.action }}

stages:
- stage: DeployStage
  displayName: Build + Deploy
  condition: eq(variables['action'], 'deploy')
  jobs:
  - job: DeployJob
    displayName: Build and Deploy to IIS
    steps:
    - checkout: self
      clean: true

    - task: PowerShell@2
      displayName: 'MSBuild & Publish'
      inputs:
        targetType: 'inline'
        script: |
          $msbuild = "C:\Program Files\Microsoft Visual Studio\2022\Community\MSBuild\Current\Bin\MSBuild.exe"
          $solutionFiles = Get-ChildItem -Path "$(Build.SourcesDirectory)" -Recurse -Filter *.sln
          if ($solutionFiles.Count -eq 1) {
              $solutionPath = $solutionFiles[0].FullName
              & $msbuild $solutionPath /p:Configuration=$(buildConfiguration) /p:DeployOnBuild=true /p:PublishProfile=FolderProfile /p:PublishDir="$(sourcePath)\"
          } else {
              Write-Host "##vso[task.logissue type=error]Solution file issue"
              exit 1
          }

    - task: PowerShell@2
      name: PackageBuild
      displayName: 'Package Build'
      inputs:
        targetType: 'inline'
        script: |
          $timestamp = Get-Date -Format 'yyyyMMddHHmmss'
          $zipPath = "$(publishPath)\$(zipBaseName)_$timestamp.zip"
          Compress-Archive -Path "$(sourcePath)\*" -DestinationPath $zipPath -Force
          Write-Host "##vso[task.setvariable variable=publishZipPath;isOutput=true]$zipPath"

    - task: PowerShell@2
      displayName: 'Stop App Pool'
      inputs:
        targetType: 'inline'
        script: |
          if ((Get-WebAppPoolState -Name "$(appPoolName)").Value -ne "Stopped") {
              & "C:\Windows\System32\inetsrv\appcmd" stop apppool "/apppool.name:$(appPoolName)"
              Start-Sleep -Seconds 10
          }

    - task: PowerShell@2
      displayName: 'Backup Current Deployment'
      inputs:
        targetType: 'inline'
        script: |
          if (Test-Path "$(deployPath)") {
              $timestamp = Get-Date -Format 'yyyyMMddHHmmss'
              $backupPath = "$(backupRootPath)\$(appPoolName)_$timestamp.zip"
              Compress-Archive -Path "$(deployPath)\*" -DestinationPath $backupPath -Force
              Write-Host "Backup created at $backupPath"
          }

    - task: PowerShell@2
      displayName: 'Deploy Files'
      inputs:
        targetType: 'inline'
        script: |
          $zipPath = "$(publishZipPath)"
          if (-not (Test-Path $zipPath)) {
              Write-Host "##vso[task.logissue type=error]ZIP file not found: $zipPath"
              exit 1
          }
          Remove-Item -Recurse -Force "$(deployPath)\*" -ErrorAction SilentlyContinue
          Expand-Archive -Path $zipPath -DestinationPath "$(deployPath)" -Force

    - task: PowerShell@2
      displayName: 'Restore config files from backup'
      inputs:
        targetType: 'inline'
        script: |
          $latestBackup = Get-ChildItem "$(backupRootPath)" -Filter '*.zip' | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if ($latestBackup) {
              $tempExtract = "$(sourcePath)\_config_restore"
              Expand-Archive -Path $latestBackup.FullName -DestinationPath $tempExtract -Force
              foreach ($file in @("appsettings.json", "web.config")) {
                  $src = Join-Path $tempExtract $file
                  if (Test-Path $src) {
                      Copy-Item $src -Destination "$(deployPath)" -Force
                  }
              }
              Remove-Item -Recurse -Force $tempExtract
          }

    - task: PowerShell@2
      displayName: 'Start App Pool'
      inputs:
        targetType: 'inline'
        script: |
          & "C:\Windows\System32\inetsrv\appcmd" start apppool "/apppool.name:$(appPoolName)"
          Start-Sleep -Seconds 10
          if ((Get-WebAppPoolState -Name "$(appPoolName)").Value -ne "Started") {
              Write-Host "##vso[task.logissue type=error]App pool failed to start"
              exit 1
          }

- stage: RollbackStage
  displayName: Rollback Deployment
  condition: eq(variables['action'], 'rollback')
  jobs:
  - job: RollbackJob
    displayName: Restore Last Backup
    steps:
    - task: PowerShell@2
      displayName: 'Stop App Pool'
      inputs:
        targetType: 'inline'
        script: |
          if ((Get-WebAppPoolState -Name "$(appPoolName)").Value -ne "Stopped") {
              & "C:\Windows\System32\inetsrv\appcmd" stop apppool "/apppool.name:$(appPoolName)"
              Start-Sleep -Seconds 10
          }

    - task: PowerShell@2
      displayName: 'Restore Backup'
      inputs:
        targetType: 'inline'
        script: |
          $latestBackup = Get-ChildItem "$(backupRootPath)" -Filter '*.zip' | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if ($latestBackup) {
              Remove-Item -Recurse -Force "$(deployPath)\*" -ErrorAction SilentlyContinue
              Expand-Archive -Path $latestBackup.FullName -DestinationPath "$(deployPath)" -Force
          } else {
              Write-Host "##vso[task.logissue type=error]No backup found"
              exit 1
          }

    - task: PowerShell@2
      displayName: 'Start App Pool'
      inputs:
        targetType: 'inline'
        script: |
          & "C:\Windows\System32\inetsrv\appcmd" start apppool "/apppool.name:$(appPoolName)"
          Start-Sleep -Seconds 10
          if ((Get-WebAppPoolState -Name "$(appPoolName)").Value -ne "Started") {
              Write-Host "##vso[task.logissue type=error]App pool failed to start after rollback"
              exit 1
          }
